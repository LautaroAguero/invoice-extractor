[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Extracts Argentine invoices into validated objects and measures its own reliability and cost."
requires-python = ">=3.14"
dependencies = [
    # Bounded: the schema design relies on how transform_schema behaves in 1.5 (schema.py
    # notes). tests/test_schema.py snapshots the transformed schema; bump deliberately.
    "anthropic>=1.5,<1.6",
    "pydantic>=2",
    "python-dotenv",
    # Path B text extraction (PRD 03 R5.1). MIT, so unlike the GPL generator it needs no isolation.
    "pdfplumber>=0.11,<0.12",
]

[project.optional-dependencies]
dev = ["pytest"]
# The local page (PRD 06). Optional on purpose: the core package and pytest never need it.
ui = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
